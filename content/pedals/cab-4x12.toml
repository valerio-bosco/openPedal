# Composite pedal: a 4x12 cab with two exposed knobs.
name = "4x12 Cab"
category = "amp"
description = "Closed-back rock cab: punchy lows, scooped mids."

[[node]]
id = "c"
type = "cab"
params = { low_hz = 105, low_q = 1.5, high_hz = 4800, mid_db = -4, presence_db = 3, ripple_db = 3.5, seed = 7 }

[[edge]]
from = "pedal_in"
to = "c"

[[edge]]
from = "c"
to = "pedal_out"

[[knob]]
label = "Brightness"
target = "c.high_hz"
min = 3500
max = 7000
default = 0.4

[[knob]]
label = "Mids"
target = "c.mid_db"
min = -10
max = 6
default = 0.4
