# Muse - "Cryogen": squelching intro (Fuzz Factory oscillation).
# Reference: Bellamy's Fuzz Factory (ZVEX/Vexter, confirmed on the track by the
# producer's posts) set for gated, sputtering, self-oscillating wail. See
# docs/tones/cryogen.md for sources and confidence levels. The real sound is
# partly hand-played (Gate/Stab knobs, Kaoss pad, whammy): the engine has no
# live control, so this preset gives the static fuzz character only.
name = "cryogen-intro"
version = 2

[[node]]
id = "in"
type = "input"
pos = [0, 120]

[[node]]
id = "gate"
type = "gate"
pos = [160, 120]
params = { threshold_db = -60, release_ms = 80 }   # only removes hiss: the fuzz has its own gate

[[node]]
id = "fuzz"
type = "fuzz"
pos = [320, 120]
params = { drive = 0.95, gate = 0.3, comp = 0.8, bias = 0.5, tone_hz = 9000, level_db = -14 }   # gate depends on input level: tuned on a signal peaking at -12 dBFS.
# Higher values choke sustained notes into sputter; lower ones let it ring.

[[node]]
id = "stack"
type = "tonestack"
pos = [480, 120]
params = { model = "marshall", bass = 0.3, mid = 0.7, treble = 0.7 }

[[node]]
id = "amp"
type = "drive"
pos = [640, 120]
params = { shape = "asym", gain_db = 6, level_db = -4, bias = 0.2, quality = "alta" }

[[node]]
id = "cab"
type = "cab"
pos = [800, 120]
params = { low_hz = 110, low_q = 1.4, high_hz = 5400, mid_db = -2, presence_hz = 2800, presence_db = 4, ripple_db = 3, seed = 7 }

[[node]]
id = "room"
type = "reverb"
pos = [960, 120]
params = { room = 0.35, damp = 0.6, mix = 0.12, predelay_ms = 12 }

[[node]]
id = "out"
type = "output"
pos = [1120, 120]
params = { volume_db = -18 }

[[edge]]
from = "in"
to = "gate"

[[edge]]
from = "gate"
to = "fuzz"

[[edge]]
from = "fuzz"
to = "stack"

[[edge]]
from = "stack"
to = "amp"

[[edge]]
from = "amp"
to = "cab"

[[edge]]
from = "cab"
to = "room"

[[edge]]
from = "room"
to = "out"
