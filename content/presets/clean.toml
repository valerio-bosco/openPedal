# A true clean: no saturation, a bright open-back 2x12 cab.
name = "Clean"
output_db = 2

[[block]]
type = "gate"          # low threshold: only removes the hiss when the strings are muted
threshold_db = -70
release_ms = 150

[[block]]
type = "filter"        # removes the boomy sub-lows
kind = "highpass"
freq = 70

[[block]]
type = "cab"           # procedural cab: try changing seed or high_hz
low_hz = 90
low_q = 1.1
high_hz = 6000         # higher = brighter
mid_db = -2
presence_hz = 2800
presence_db = 2
ripple_db = 2
seed = 3
