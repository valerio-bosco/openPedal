# Muse - "Cryogen": chorus / arena rhythm guitar.
# Reference (likely, not confirmed): fuzz with less gate and more sustain for
# wide power chords, plus a phaser (MXR Phase 95 per the producer's posts) that
# openPedal does not have: a slow, shallow chorus stands in for it.
# In the song this part is double-tracked (two takes, hard left and right).
# The separated guitar goes down to B1 (62 Hz) even where the bass is silent,
# below a standard-tuned guitar: hence the octave-down "sub" (Whammy or
# Octavider style). Tone fitted on the separated guitar (64-76 s); checked on a
# real DI: 6.7 dB rms error vs 10.8 before.
# See docs/tones/cryogen.md.
name = "cryogen-chorus"
version = 2

[[node]]
id = "in"
type = "input"
pos = [0, 120]

[[node]]
id = "gate"
type = "gate"
pos = [160, 120]
params = { threshold_db = -58, release_ms = 100 }   # hiss only

[[node]]
id = "tight"
type = "filter"
pos = [320, 120]
params = { kind = "highpass", freq = 108 }

[[node]]
id = "sub"
type = "octave"
pos = [400, 240]
params = { dry = 1.0, down = 0.30, up = 0.0, tone_hz = 1500, track_hz = 700 }

[[node]]
id = "fuzz"
type = "fuzz"
pos = [480, 120]
params = { drive = 0.80, gate = 0.05, comp = 0.71, bias = 0.3, tone_hz = 7923, level_db = -14 }   # gate depends on input level: low on purpose so chords sustain.

[[node]]
id = "stack"
type = "tonestack"
pos = [640, 120]
params = { model = "marshall", bass = 0.38, mid = 0.57, treble = 0.69 }

[[node]]
id = "amp"
type = "drive"
pos = [800, 120]
params = { shape = "asym", gain_db = 6.1, level_db = -5, bias = 0.2, quality = "alta" }

[[node]]
id = "cab"
type = "cab"
pos = [960, 120]
params = { low_hz = 101, low_q = 1.4, high_hz = 7366, mid_db = -3.4, presence_hz = 2800, presence_db = 5.7, ripple_db = 3, seed = 7 }

[[node]]
id = "phase"
type = "chorus"
pos = [1120, 120]
params = { rate_hz = 0.35, base_ms = 6, depth_ms = 2, mix = 0.3 }   # stand-in for the Phase 95

[[node]]
id = "room"
type = "reverb"
pos = [1280, 120]
params = { room = 0.45, damp = 0.5, mix = 0.15, predelay_ms = 15 }

[[node]]
id = "out"
type = "output"
pos = [1440, 120]
params = { volume_db = -18 }

[[edge]]
from = "in"
to = "gate"

[[edge]]
from = "gate"
to = "tight"

[[edge]]
from = "tight"
to = "sub"

[[edge]]
from = "sub"
to = "fuzz"

[[edge]]
from = "fuzz"
to = "stack"

[[edge]]
from = "stack"
to = "amp"

[[edge]]
from = "amp"
to = "cab"

[[edge]]
from = "cab"
to = "phase"

[[edge]]
from = "phase"
to = "room"

[[edge]]
from = "room"
to = "out"
