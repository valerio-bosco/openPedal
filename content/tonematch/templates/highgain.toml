# Template: highgain. Low-gain soft boost before a hard, high-gain amp; the stack sits after the amp.
# Starting point for the tone fit; ranges in highgain.fit.toml.
name = "template-highgain"
version = 2

[[node]]
id = "in"
type = "input"
pos = [0, 120]

[[node]]
id = "gate"
type = "gate"
pos = [160, 120]
params = { threshold_db = -48, release_ms = 60 }

[[node]]
id = "tight"
type = "filter"
pos = [320, 120]
params = { kind = "highpass", freq = 100 }

[[node]]
id = "od"
type = "drive"
pos = [480, 120]
params = { shape = "soft", gain_db = 6, level_db = -2, bias = 0.1, quality = "alta" }

[[node]]
id = "amp"
type = "drive"
pos = [640, 120]
params = { shape = "hard", gain_db = 34, level_db = -6, bias = 0.1, quality = "alta" }

[[node]]
id = "stack"
type = "tonestack"
pos = [800, 120]
params = { model = "marshall", bass = 0.5, mid = 0.7, treble = 0.7 }

[[node]]
id = "cab"
type = "cab"
pos = [960, 120]
params = { low_hz = 90, low_q = 1.4, high_hz = 6000, mid_db = -3, presence_hz = 2500, presence_db = 2, ripple_db = 3, seed = 7 }

[[node]]
id = "room"
type = "reverb"
pos = [1120, 120]
params = { room = 0.3, damp = 0.5, mix = 0.12, predelay_ms = 12 }

[[node]]
id = "out"
type = "output"
pos = [1280, 120]
params = { volume_db = -18 }

[[edge]]
from = "in"
to = "gate"

[[edge]]
from = "gate"
to = "tight"

[[edge]]
from = "tight"
to = "od"

[[edge]]
from = "od"
to = "amp"

[[edge]]
from = "amp"
to = "stack"

[[edge]]
from = "stack"
to = "cab"

[[edge]]
from = "cab"
to = "room"

[[edge]]
from = "room"
to = "out"
