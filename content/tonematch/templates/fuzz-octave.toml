# Template: fuzz-octave. The fuzz chain with an octave-down (and dry) stage before the fuzz.
# Starting point for the tone fit; ranges in fuzz-octave.fit.toml.
name = "template-fuzz-octave"
version = 2

[[node]]
id = "in"
type = "input"
pos = [0, 120]

[[node]]
id = "gate"
type = "gate"
pos = [160, 120]
params = { threshold_db = -55, release_ms = 60 }

[[node]]
id = "tight"
type = "filter"
pos = [320, 120]
params = { kind = "highpass", freq = 105 }

[[node]]
id = "sub"
type = "octave"
pos = [480, 120]
params = { dry = 1.0, down = 0.3, up = 0, tone_hz = 1500, track_hz = 700 }

[[node]]
id = "fuzz"
type = "fuzz"
pos = [640, 120]
params = { drive = 0.7, gate = 0.2, comp = 0.6, bias = 0.4, tone_hz = 6000, level_db = -12 }

[[node]]
id = "stack"
type = "tonestack"
pos = [800, 120]
params = { model = "marshall", bass = 0.5, mid = 0.8, treble = 0.7 }

[[node]]
id = "amp"
type = "drive"
pos = [960, 120]
params = { shape = "asym", gain_db = 8, level_db = -5, bias = 0.2, quality = "alta" }

[[node]]
id = "cab"
type = "cab"
pos = [1120, 120]
params = { low_hz = 90, low_q = 1.4, high_hz = 6000, mid_db = -3, presence_hz = 2500, presence_db = 2, ripple_db = 3, seed = 7 }

[[node]]
id = "room"
type = "reverb"
pos = [1280, 120]
params = { room = 0.3, damp = 0.5, mix = 0.12, predelay_ms = 12 }

[[node]]
id = "out"
type = "output"
pos = [1440, 120]
params = { volume_db = -18 }

[[edge]]
from = "in"
to = "gate"

[[edge]]
from = "gate"
to = "tight"

[[edge]]
from = "tight"
to = "sub"

[[edge]]
from = "sub"
to = "fuzz"

[[edge]]
from = "fuzz"
to = "stack"

[[edge]]
from = "stack"
to = "amp"

[[edge]]
from = "amp"
to = "cab"

[[edge]]
from = "cab"
to = "room"

[[edge]]
from = "room"
to = "out"
