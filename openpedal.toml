# Where the guitar comes in and where the sound goes out.
# These are regexes on port names: `openpedal ports` lists them all.
input = "Scarlett.*capture_AUX1"   # Scarlett Solo input 2 (INST jack); AUX0 is the XLR input
output = "Scarlett.*playback"      # Scarlett headphones / monitors

# USB speakers (higher latency):
# output = "Pebble.*playback"

# Samples per cycle (at 48 kHz: 96 = 2 ms, 128 = 2.7 ms, 256 = 5.3 ms).
# Measured with tools/buffer-test.sh on 2026-11-08 on the Scarlett Solo:
#   48 and 64 -> the input drops audio (thousands of clicks); 96 and above -> clean.
# If you hear crackles while the computer is busy, raise it to 128.
buffer = 96
