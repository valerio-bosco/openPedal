[package]
name = "openpedal"
version = "0.1.0"
edition = "2021"
description = "Pedaliera di effetti per chitarra in tempo reale, con effetti definiti da preset"

[dependencies]
jack = "0.13"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rustfft = "6.4"
serde_json = "1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
rust-embed = "8.13"
webbrowser = "1.2"
futures-util = "0.3.34"

[dev-dependencies]
tokio-tungstenite = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Anche in debug il DSP deve girare veloce, altrimenti il callback sfora il buffer.
[profile.dev]
opt-level = 2
