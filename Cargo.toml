[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Real-time guitar effects with a node-graph editor for building and combining pedals"

[workspace.dependencies]
openpedal-dsp = { path = "crates/dsp" }
openpedal-graph = { path = "crates/graph" }
openpedal-protocol = { path = "crates/protocol" }
openpedal-engine = { path = "crates/engine" }
openpedal-library = { path = "crates/library" }
openpedal-server = { path = "crates/server" }

rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rustfft = "6.4"
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.30", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
rust-embed = "8.13"
webbrowser = "1.2"
futures-util = "0.3.34"
jack = "0.13"
tokio-tungstenite = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The DSP must be fast in debug builds too, or the callback overruns the buffer.
[profile.dev]
opt-level = 2
