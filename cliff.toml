# git-cliff configuration for both release products (desktop and iPad).
# Used by tools/release.sh, which adds the product-specific scope rule
# (`ios` for desktop, `ui` for iPad) in front of commit_parsers. See docs/RELEASING.md.

[changelog]
header = """
# Changelog

All notable changes are listed here, newest first. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) from Conventional
Commits. Do not edit it by hand: run `tools/release.sh` (see `docs/RELEASING.md`).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="desktop-v") | trim_start_matches(pat="ios-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
# Commits before the switch to Conventional Commits (in Italian) are not listed.
filter_unconventional = true
# Scope rules below decide what each product sees: never keep a skipped commit
# just because it is a breaking change.
protect_breaking_commits_from_being_skipped = false
split_commits = false
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # Release commits created by tools/release.sh.
  { message = "^chore\\(release\\)", skip = true },
  # Scopes that never reach a changelog. (git-cliff's `scope` key only sets a default
  # scope; matching is done on the summary line.)
  { message = "^[a-z]+\\((docs|nix|chore)\\)!?:", skip = true },
  # Protocol bumps and other breaking changes: a `BREAKING CHANGE:` footer in the body.
  { footer = "BREAKING CHANGE", group = "Breaking changes" },
  { message = "^[a-z]+(\\(.*\\))?!:", group = "Breaking changes" },
  { message = "^feat(\\(.*\\))?!?:", group = "Features" },
  { message = "^fix(\\(.*\\))?!?:", group = "Fixes" },
  { message = "^perf(\\(.*\\))?!?:", group = "Performance" },
  { message = "^refactor(\\(.*\\))?!?:", group = "Refactor" },
  { message = "^docs(\\(.*\\))?!?:", group = "Documentation" },
  # Everything else (test, build, unscoped chore, ...) stays out of the changelog.
  { message = ".*", skip = true },
]
