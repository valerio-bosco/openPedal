[package]
name = "openpedal-server"
version.workspace = true
edition.workspace = true
description = "openPedal HTTP and WebSocket server for the interface"

[features]
# Tone Lab in process (docs/PLAN.md §15): Demucs C++ separation + the Rust analysis. Off by default (compiles C++).
native-tonelab = ["dep:openpedal-separate", "dep:openpedal-tonelab"]

[dependencies]
openpedal-dsp.workspace = true
openpedal-graph.workspace = true
openpedal-protocol.workspace = true
openpedal-library.workspace = true
openpedal-engine.workspace = true
openpedal-tonematch.workspace = true
openpedal-separate = { workspace = true, optional = true }
openpedal-tonelab = { workspace = true, optional = true }
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
rust-embed.workspace = true
webbrowser.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
toml.workspace = true
