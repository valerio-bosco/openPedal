[package]
name = "openpedal-ffi"
version.workspace = true
edition.workspace = true
description = "openPedal C ABI for the iPad app (static library libopenpedal.a)"

# The library is named `openpedal` so the iOS build produces libopenpedal.a.
[lib]
name = "openpedal"
crate-type = ["staticlib"]

[features]
# Spike (docs/spikes/ios-cxx.md): C++17 + Eigen in the core. Off by default.
cxx-probe = ["dep:openpedal-cxx-probe"]

[dependencies]
openpedal-cxx-probe = { path = "../cxx-probe", optional = true }
openpedal-graph.workspace = true
openpedal-library.workspace = true
openpedal-engine.workspace = true
openpedal-server.workspace = true
anyhow.workspace = true
toml.workspace = true
