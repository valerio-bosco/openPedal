name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('apps/desktop/ui/package-lock.json') }}
          restore-keys: npm-

      - name: Test
        run: nix develop -c cargo test --workspace

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Build UI
        run: nix develop -c bash -c "cd apps/desktop/ui && npm ci && npm run build"
